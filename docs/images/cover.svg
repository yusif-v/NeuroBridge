    <linearGradient id="violet" x2="1" y2="1"><stop stop-color="#b28aff"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#8b5cf6" stop-opacity=".22"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#a78bfa" stroke-opacity=".065"/></pattern>
  </defs>
  <rect width="1280" height="420" rx="20" fill="url(#bg)"/>
  <rect width="1280" height="420" rx="20" fill="url(#grid)"/>
  <ellipse cx="995" cy="190" rx="390" ry="310" fill="url(#halo)"/>
  <rect x=".5" y=".5" width="1279" height="419" rx="20" fill="none" stroke="#a78bfa" stroke-opacity=".18"/>
