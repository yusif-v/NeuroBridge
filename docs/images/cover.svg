    <text x="118" y="83" fill="#9a91b1" font-size="10" letter-spacing="3">GAME QA WORKSPACE</text>
    <text x="62" y="170" fill="#bba7ed" font-size="12" letter-spacing="3">FROM PLAYABLE BUILD TO VERIFIED EVIDENCE</text>
    <text x="58" y="238" fill="#f9f7ff" font-size="57" font-weight="700" letter-spacing="-2">Play. Replay. Explain.</text>
