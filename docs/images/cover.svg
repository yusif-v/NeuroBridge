<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
  <title id="title">BugLens AI — Play. Replay. Explain.</title>
  <desc id="desc">A dark violet branded cover for an AI playtesting workspace, showing a game input, independent replay and evidence report.</desc>
  <defs>
